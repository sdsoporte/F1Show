    <!-- Suppress Vite HMR WebSocket proxy disconnection log in iframe/cloud preview -->
    <script>
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && (String(event.reason).includes('WebSocket closed') || String(event.reason).includes('vite'))) {
          event.preventDefault();
        }
      });
      (function() {
        var _origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (firstArg && typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket closed without opened') !== -1)) {
            return;
          }
          return _origError.apply(console, arguments);
        };
      })();
    </script>
