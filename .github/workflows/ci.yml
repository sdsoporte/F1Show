# The repository's own CI. Three properties are the reason this file exists: the declared Python
# floor (>= 3.12) is a claim nothing enforced, the lint standard lived outside the repository,
# and a silenced lint rule had no owner. All three are checked here, and the Ruff version is
# pinned because version drift was the observed failure mode.
#
# The suite is offline by design: it uses recorded fixtures, fake providers and an injected
# clock. No step needs a credential, a live endpoint or a paid provider.
#
# Every job carries a `timeout-minutes`: without one a hung step can occupy a runner for hours,
# which is the one failure mode that is invisible in a green badge.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor in pyproject.toml and must *run*, not be asserted.
        # 3.14 is the interpreter this repository is developed on.
        python: ["3.12", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the locked environment
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run the offline suite
        run: uv run --frozen --python ${{ matrix.python }} pytest -q

  lint:
    name: ruff on the committed selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The selection and its documented exceptions live in the repository's own ruff.toml, so a
      # reader can reproduce this locally. `--no-cache` keeps the result independent of cache
      # state; the version is pinned so a report from one machine means the same on another.
      - name: Report the version and the selection's own counts
        run: |
          uvx ruff@0.17.0 --version
          uvx ruff@0.17.0 check --no-cache --statistics src tests

      - name: Enforce the committed selection
        run: uvx ruff@0.17.0 check --no-cache src tests

  register:
    name: every ignored rule has a register row
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # No `setup-uv` here, deliberately: this job installs nothing, fetches nothing and uses
      # only the runner's own `python3`. Adding a toolchain step it never calls would make the
      # job's stated property true of the step and false of the job.
      #
      # This guard exists because `ruff.toml` states an obligation -- every exception carries a
      # row in `docs/CARRIED-FINDINGS.md` with its count, the revision and version it was measured
      # on, an owner and the removal trigger -- and an obligation nothing checks is a promise.
      #
      # It is deliberately as dumb as it can be: it reads the ignored rules out of `ruff.toml`,
      # then checks that each rule code appears *somewhere* in the register. It does NOT parse the
      # register, and it does not check that the row is well-formed, because the register is prose
      # written by a human and a parser there would be a second thing to keep correct. A missing
      # code fails the job and names the rule, which is the whole contract.
      #
      # It runs on the runner's own `python3` for two reasons: it needs no project environment and
      # no network, and `tomllib` is standard library. The version it needs is stated out loud
      # rather than assumed.
      - name: Every ignored rule has a row
        run: |
          python3 - <<'PY'
          import pathlib, sys

          try:
              import tomllib
          except ModuleNotFoundError:
              sys.exit("register guard: this step needs Python 3.11+ for tomllib and the runner does not provide it")

          config = tomllib.loads(pathlib.Path("ruff.toml").read_text())
          lint = config.get("lint")
          if lint is None or "ignore" not in lint:
              sys.exit("register guard: ruff.toml must declare [lint].ignore; without it the silenced rules cannot be read and this guard would check a subset in silence")
          ignored = set(lint["ignore"])
          for rules in lint.get("per-file-ignores", {}).values():
              ignored.update(rules)

          register_path = pathlib.Path("docs/CARRIED-FINDINGS.md")
          if not register_path.exists():
              sys.exit(f"register guard: {register_path} does not exist, so no ignored rule can have a row")

          register = register_path.read_text()
          missing = sorted(rule for rule in ignored if rule not in register)
          if missing:
              sys.exit(
                  "register guard: these ignored rules have no row in docs/CARRIED-FINDINGS.md: "
                  + ", ".join(missing)
                  + ". Every exception in ruff.toml must carry a row with its count, the revision "
                  "and version it was measured on, an owner, and the condition that removes it."
              )
          print(f"register guard: all {len(ignored)} ignored rules have a row: {', '.join(sorted(ignored))}")
          PY
