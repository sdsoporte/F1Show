[project]
name = "f1show"
version = "0.1.0"
description = "Replay-testable, real-time Formula 1 commentary system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "httpx==0.28.1",
    "google-genai==2.29.0",
    "redis",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1show"]

[tool.pytest.ini_options]
testpaths = ["tests"]
